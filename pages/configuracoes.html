        <h1 class="pb-2 border-bottom mb-4">Configurações</h1>
        <div class="container-fliud">
            <div class="row">
                <div class="col">
                    <h3 class="border-bottom pb-2">Dados do usuário</h3>
                    <div class="row">
                        <div class="col mb-3">
                            <input type="hidden" id="id-adicionar" />
                            <div class="input-group">
                                <span class="input-group-text" id="visible-addon">@</span>
                                <input type="text" class="form-control" placeholder="Username" aria-label="Username"
                                    aria-describedby="visible-addon">
                                <input type="text" class="form-control d-none" placeholder="Hidden input"
                                    aria-label="Hidden input" aria-describedby="visible-addon">
                            </div>
                        </div>
                        <div class="col mb-3">
                            <input type="text" class="form-control" id="nomeUsuario" placeholder="ex: Maria da Silva"
                                aria-label="Nome Completo" aria-describedby="basic-addon1">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <input type="email" class="form-control" id="exampleFormControlInput1"
                                placeholder="name@example.com">
                        </div>
                        <div class="col mb-3">
                            <input type="password" id="senhaAtual" class="form-control"
                                aria-describedby="passwordHelpInline" placeholder="Senha Atual">
                        </div>
                    </div>
                    <div class="row">
                            <div class="col-auto">
                                <input type="password" id="novaSenha" class="form-control"
                                    aria-describedby="passwordHelpInline" placeholder="Nova Senha">
                            </div>
                            <div class="col-auto">
                                <input type="password" id="confirmarSenha" class="form-control"
                                    aria-describedby="passwordHelpInline" placeholder="Confirmar Senha">
                            </div>
                            <div class="col-auto">
                                <span id="passwordHelpInline" class="form-text">
                                    Deve ter entre 8 e 20 caracteres.
                                </span>
                            </div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Bio</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="file" class="form-control" id="inputGroupFile04"
                                aria-describedby="inputGroupFileAddon04" aria-label="Upload">
                            <button class="btn btn-outline-secondary" type="button"
                                id="inputGroupFileAddon04">Confirmar</button>
                        </div>
                    </div>
                    <h3 class="border-bottom pb-2">Contagem Regressiva</h3>
                    <div class="row" id="linha-contagem"></div>
                </div>
                <div class="col">
                    <h3 class="border-bottom pb-2">Integrações</h3>
                    <div id="linha-tmdb"></div>
                    <br />
                    <div id="linha-mal"></div>
                    <br />
                    <div id="linha-google"></div>
                    <br />
                    <div id="linha-outlook"></div>
                    <br />
                    <div id="linha-clima"></div>
                </div>
            </div>
            <br />
            <div class="row mt-2">
                <div class="col">
                    <button type="submit" class="btn btn-primary" id="btn-salvar"
                        title="Salvar Configurações">Salvar</button>
                </div>
            </div>
        </div>
