<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard - Agenda</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <header>
        <div class="px-3 py-2 bg-dark bg-body-tertiary">
            <div class="container-fliud">
                <div class="d-flex flex-wrap align-items-center justify-content-between"> 
                    <!-- Esquerda: Título e Breadcrumb -->                  
                    <div class="d-flex align-items-center">
                        <a class="navbar-brand fw-bold me-4" href="../index.html">Life Dashboard</a>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item active" aria-current="page">Agenda</li>
                            </ol>
                        </nav>
                    </div>

                    <!-- Direita: Pesquisa e Avatar -->
                    <div class="d-flex align-items-center ms-auto">
                        <form class="d-flex me-3" id="pesquisar" role="search">
                            <input class="form-control" type="search" placeholder="Pesquisar..." aria-label="Pesquisar">
                        </form>
            
                        <div class="d-flex justify-content-between align-items-lg-center gap-3">
                            <a href="#" class="d-flex align-items-center text-decoration-none">
                                <img src="https://github.com/mdo.png" alt="mdo" width="32" height="32" class="rounded-circle" _mstalt="33306" _msthash="42">
                                Luciene
                            </a>
                            <a href="#" title="Modo Escuro" class="icones-navbar"><i class="bi bi-moon-stars-fill"></i></a>
                            <a href="/configuracoes.html" title="Configurações" class="icones-navbar"><i class="bi bi-gear-fill"></i></a>                  
                            <a href="#" title="Sair" class="icones-navbar"><i class="bi bi-box-arrow-right"></i></a>
                        </div>                    
                    </div>
                </div>
            </div>
        </div>
    </header>
 
    <main class="container-fliud m-4">  
        <h1 class="pb-2 border-bottom mb-4">Agenda</h1>                  
        <div class="row">                    
            <div class="col">
                <div class="card" data-filtro="tipo" data-tipo="tipo">
                    <div class="card-header">
                        <i class="bi bi-list-columns-reverse"></i> Tipo
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="hidden" class="form-control" id="id-tipo">
                            <input type="text" class="form-control" id="descricao-tipo" placeholder="Novo tipo..." aria-label="Nova tipo...">
                            <button class="btn btn-outline-secondary" type="button" title="Adicionar Tipo" id="adiciona-tipo"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <div class="list-group"> 
                            <label class="list-group-item d-flex gap-3"> 
                                <input class="form-check-input flex-shrink-0" type="checkbox" value="" checked="" style="font-size: 1.375em;"> 
                                <span class="pt-1 form-checked-content"> 
                                    Tipo
                                </span> 
                                <button class="btn" type="button" id="botao-editar" title="Editar">
                                    <i class="bi bi-pencil-fill" id="editar"></i>
                                </button>                                 
                                <button class="btn" type="button" id="botao-excluir" title="Excluir">
                                    <i class="bi bi-trash" id="excluir"></i>
                                </button>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card" data-filtro="status" data-tipo="status">
                    <div class="card-header">
                        <i class="bi bi-arrow-repeat"></i> Status
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="hidden" class="form-control" id="id-status">
                            <input type="text" class="form-control" id="descricao-status" placeholder="Nova status..." aria-label="Nova status...">
                            <button class="btn btn-outline-secondary" type="button" title="Adicionar Status" id="adiciona-status"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush gap-1" id="lista-status">
                            
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card" data-filtro="categoria" data-tipo="categoria">
                    <div class="card-header">
                        <i class="bi bi-list-task"></i> Categoria
                    </div>
                    <div class="card-body">
                            <div class="input-group mb-3">
                            <input type="hidden" class="form-control" id="id-plataforma">
                            <input type="text" class="form-control" id="descricao-categoria" placeholder="Nova categoria..." aria-label="Nova categoria...">
                            <button class="btn btn-outline-secondary" type="button" title="Adicionar Categoria" id="adiciona-categoria"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush gap-1" id="lista-categoria">
                            
                        </ul>
                    </div>
                </div>
            </div>
        </div>   

        <table class="table-responsive table-hover datatable">
            <thead>
                <tr>
                    <th>Titulo</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Categoria</th>
                    <th class="text-center">Tipo</th>
                    <th>Data</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody class="table-group-divider" id="linhas">
                
            </tbody>
        </table>
    </main>
    
    <!-- Estrutura do modal -->
     <div id="container-modal"></div>
    
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center"> 
            <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap">
            </a> 
                <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span> 
            </div>
        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
            <li class="ms-3">
                <a class="text-body-secondary" href="#" aria-label="Instagram">
                    <i class="bi bi-instagram"></i>
                </a>
            </li>
            <li class="ms-3">
                <a class="text-body-secondary" href="#" aria-label="Facebook">
                    <i class="bi bi-facebook"></i>
                </a>
            </li>
        </ul>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/componentes/datatables.min.js"></script>
    <script src="../js/componentes/iniciaDataTable.js"></script>
    <script src="../js/agenda.js" type="module"></script>
</body>
</html>
