
       <div class="row row-cols-auto"> 
        <div class="col-5 mb-4">
            <div class="col">
                <h3 >Próximos Compromissos</h3>
                <div class="list-group text-start" id="proximos-compromissos" data-filtro="compromissos" data-status="recentes"></div>
            </div>
        </div>
        <div class="col-7 mb-4 justify-content-center">
            <div class="col">
                <canvas id="graficoCategoria"></canvas>
            </div>                         
        </div>
       </div>               
        <div class="row">                    
            <div class="col">
                <div class="card" data-filtro="tipo" data-tipo="tipo">
                    <div class="card-header">
                        <i class="bi bi-list-columns-reverse"></i> Tipo
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="hidden" class="form-control" id="input-id-tipos">
                            <input type="text" class="form-control" id="descricao-tipos" placeholder="Novo tipo..." aria-label="Nova tipo...">
                            <button class="btn btn-outline-secondary" type="button" title="Adicionar Tipo" id="adiciona-tipo"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush gap-1" id="lista-tipo"> </ul>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card" data-filtro="status" data-tipo="status">
                    <div class="card-header">
                        <i class="bi bi-arrow-repeat"></i> Status
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="hidden" class="form-control" id="input-id-status">
                            <input type="text" class="form-control" id="descricao-status" placeholder="Nova status..." aria-label="Nova status...">
                            <button class="btn btn-outline-secondary" type="button" title="Adicionar Status" id="adiciona-status"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush gap-1" id="lista-status"></ul>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card" data-filtro="categoria" data-tipo="categoria">
                    <div class="card-header">
                        <i class="bi bi-list-task"></i> Categoria
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                        <input type="hidden" class="form-control" id="input-id-categoria">
                        <input type="text" class="form-control" id="descricao-categoria" placeholder="Nova categoria..." aria-label="Nova categoria...">
                        <button class="btn btn-outline-secondary" type="button" title="Adicionar Categoria" id="adiciona-categoria"><i class="bi bi-plus-lg"></i></button>
                    </div>
                    <ul class="list-group list-group-flush gap-1" id="lista-categoria"> </ul>
                    </div>
                </div>
            </div>
        </div>            

        <div class="table-responsive mb-2">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom">
                <h2 class="pb-1">Lista de Agendamentos</h2>
                <button class="btn btn-primary mb-3" id="adicionarAgenda">
                    <i class="bi bi-plus-lg"></i> Adicionar a agenda
                </button>
            </div>
            <table id="tabelaAgenda" class="table-responsive table-hover datatable"></table>    
        </div>
