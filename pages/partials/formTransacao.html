<form class="row gy-2 gx-3 align-items-center" id="formTransacao" title="Adicionar transacao">    
    <div class="row d-flex justify-content-around mb-2">
        <div class="col-2 align-content-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="receita-adicionar">
                <label class="form-check-label" for="receita-adicionar">
                    Receita
                </label>
            </div>
        </div>    
        <div class="col-2 align-content-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="despesa-adicionar">
                <label class="form-check-label" for="despesa-adicionar">
                    Despesa
                </label>
            </div>
        </div>    
        <div class="col-2 align-content-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="transaferencia-adicionar">
                <label class="form-check-label" for="transaferencia-adicionar">
                    Transaferência
                </label>
            </div>
        </div>         
    </div>
    <div class="row d-flex justify-content-around mb-2 border-top border-bottom py-2">
        <div class="col-3 align-content-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="recorrente-adicionar">
                <label class="form-check-label" for="recorrente-adicionar">
                    Recorrência
                </label>
            </div>
        </div>
        <div class="col-3 align-content-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="parcelamento-adicionar">
                <label class="form-check-label" for="parcelamento-adicionar">
                    Parcelamento
                </label>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-3">
            <input type="hidden" id="id-adicionar" />
            <label for="data-adicionar" class="col-form-label">Data:</label>
            <input type="date" class="form-control" id="data-adicionar" title="Data" required>
        </div>
        <div class="col-6">
            <label for="descricao-adicionar" class="col-form-label">Descrição:</label>
            <input type="text" class="form-control" id="descricao-adicionar" title="Descrição" placeholder="Informe a transação" required>
        </div>
        <div class="col-3">
            <label for="categoria-adicionar" class="col-form-label">Categoria:</label>
            <select type="text" class="form-select" id="categoria-adicionar" title="Categoria" required></select>
        </div>
    </div>                        
    <div class="row">
        <div class="col-3">
            <label for="conta-origem-adicionar" class="col-form-label">Conta Origem:</label>
            <select type="text" class="form-select" id="conta-origem-adicionar" title="Conta Origem" required></select>
        </div>
        <div class="col-3 d-none" id="conta-destino-div">
            <label for="conta-destino-adicionar" class="col-form-label">Conta Destino:</label>
            <select type="text" class="form-select" id="conta-destino-adicionar" title="Conta Destino" required></select>
        </div>
        <div class="col-3">
            <label for="valor-adicionar" class="col-form-label">Valor:</label>
            <input type="text" class="form-control" id="valor-adicionar" title="valor" placeholder="0" required>
        </div> 
        <div class="col-3 d-none" id="parcelamento">
            <label for="parcela-adicionar" class="col-form-label">Parcelas:</label>
            <input type="text" class="form-control" id="parcela-adicionar" title="Parcelas">
        </div>  
        <div class="col-3 d-none" id="recorrencia">
            <label for="periodicidade-adicionar" class="col-form-label">Periodicidade:</label>
            <select type="text" class="form-select" id="periodicidade-adicionar" title="Periodicidade">
                <option value="Mensal">Mensal</option>
                <option value="Semanal">Semanal</option>
                <option value="Anual">Anual</option>
            </select>
        </div>               
    </div>
</form>
